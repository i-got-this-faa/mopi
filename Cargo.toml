[workspace]
members = [
    "bin/kiwi",
    "bin/mopictl",
    "bin/mopid", "crates/chunking",
    "crates/config",
    "crates/crawl",
    "crates/chunking",
    "crates/embed",
    "crates/extract",
    "crates/index-lexical",
    "crates/index-meta",
    "crates/index-vector",
    "crates/ipc",
    "crates/query",
    "crates/rank",
    "crates/test-support",
    "crates/types",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
camino = { version = "1.1.9", features = ["serde1"] }
directories = "5.0.1"
globset = "0.4.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }
tempfile = "3.23.0"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
