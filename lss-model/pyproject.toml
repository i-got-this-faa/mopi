[project]
name = "lss-model"
version = "0.1.0"
description = "Transformer embedding model training, evaluation, and ONNX export for LSS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=4.8.5",
    "evaluate>=0.4.6",
    "onnx>=1.21.0",
    "onnxruntime-gpu>=1.24.3",
    "onnxscript>=0.7.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "tokenizers>=0.22.2",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.27.0",
    "transformers>=5.9.0",
]

[project.scripts]
lss-train = "lss_model.cli:train_main"
lss-export = "lss_model.cli:export_main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lss_model*"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "setuptools>=81.0.0",
]
